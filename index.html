<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichas Médicas - UTC Emergencia</title>
    <style>
        /* Estilos básicos para que el formulario se vea ordenado */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }
        .contenedor {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Registro UTC Emergencia</h2>
        
        <!-- Formulario de datos -->
        <form id="formularioEmergencia">
            <div class="form-group">
                <label for="nombre">Nombre del Estudiante:</label>
                <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
            </div>
            
            <div class="form-group">
                <label for="carrera">Carrera:</label>
                <input type="text" id="carrera" placeholder="Ej. Ingeniería en Software" required>
            </div>

            <div class="form-group">
                <label for="emergencia">Condición / Emergencia:</label>
                <input type="text" id="emergencia" placeholder="Ej. Alergia a la penicilina" required>
            </div>

            <button type="submit">Guardar en Firebase</button>
        </form>
    </div>

    <!-- ========================================== -->
    <!-- 1. LIBRERÍAS DE FIREBASE (No borrar)       -->
    <!-- ========================================== -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- ========================================== -->
    <!-- 2. LÓGICA DE JAVASCRIPT Y CONEXIÓN         -->
    <!-- ========================================== -->
    <script>
        // Variables de tu sistema
        let masterAdminCode = "ADMIN2026"; 
        let currentTeacherKey = localStorage.getItem('utc_teacher_key') || "UTC2026"; 
        let isAdminUnlocked = false;

        // ---------------------------------------------------------
        // ¡IMPORTANTE! REEMPLAZA ESTO CON LOS DATOS DE TU PROYECTO
        // ---------------------------------------------------------
        const firebaseConfig = {
            apiKey: "PEGAR_AQUI_TU_API_KEY", // <--- Cambia esto
            authDomain: "utc-emergencia-cbe84.firebaseapp.com",
            projectId: "utc-emergencia-cbe84",
            storageBucket: "utc-emergencia-cbe84.appspot.com",
            messagingSenderId: "PEGAR_AQUI_TU_SENDER_ID", // <--- Cambia esto
            appId: "PEGAR_AQUI_TU_APP_ID" // <--- Cambia esto
        };

        // Inicializamos la conexión a Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ---------------------------------------------------------
        // Función que guarda los datos directamente en Firestore
        // ---------------------------------------------------------
        async function guardarEnBaseDeDatos(datosUsuario) {
            try {
                // Se crea la colección "fichas_medicas" y se añade el documento
                await db.collection("fichas_medicas").add(datosUsuario);
                
                console.log("✅ Éxito: Los datos se guardaron en Firebase.");
                alert("¡Ficha guardada exitosamente en la base de datos de UTC EMERGENCIA!");
                
                // Limpiar el formulario después de guardar
                document.getElementById("formularioEmergencia").reset();
            } catch (error) {
                console.error("❌ Error de Firebase:", error);
                alert("Hubo un error al guardar. Revisa la consola (F12) o las reglas de seguridad de Firebase.");
            }
        }

        // ---------------------------------------------------------
        // Detectar cuando el usuario presiona el botón "Guardar"
        // ---------------------------------------------------------
        document.getElementById('formularioEmergencia').addEventListener('submit', function(evento) {
            // Evitar que la página se recargue al enviar el formulario
            evento.preventDefault();

            // Recolectar lo que el usuario escribió en las cajas de texto
            const datosUsuario = {
                nombre: document.getElementById('nombre').value,
                carrera: document.getElementById('carrera').value,
                emergencia: document.getElementById('emergencia').value,
                fecha_registro: new Date().toISOString() // Agregamos la fecha exacta del registro
            };

            // Enviar a la base de datos
            guardarEnBaseDeDatos(datosUsuario);
        });
    </script>
</body>
</html>
